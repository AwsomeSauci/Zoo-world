name: Test, build and publish Web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'AwsomeSauci/Zoo-world' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, zooworld-unity]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Configure Git Bash for the Pages archive
        shell: pwsh
        run: |
          $gitRoot = Split-Path (Split-Path (Get-Command git).Source)
          foreach ($directory in @('bin', 'usr/bin')) {
            Join-Path $gitRoot $directory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - name: Verify simulation
        shell: pwsh
        run: ./Tools/Verify.ps1
      - name: Build WebGL
        shell: pwsh
        run: ./Tools/Build-Web.ps1
      - name: Upload test and build reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: verification
          path: TestResults/
          retention-days: 7
      - name: Upload site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: Builds/Web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v5.0.1
